# GitHub Actions CI: C++ 编译/测试 + Python 测试
# 触发：push 到 master 或 PR

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  cpp-tests:
    name: C++ Tests (GCC 15, C++23)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev \
            libboost-system-dev libboost-thread-dev libboost-filesystem-dev \
            libgl-dev libegl-dev python3-dev cmake

      - name: Configure C++ tests
        working-directory: engine
        run: |
          cmake -S tests -B build_tests \
            -DCMAKE_CXX_COMPILER=g++-15 \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build C++ tests
        working-directory: engine
        run: cmake --build build_tests -j 2

      - name: Run C++ tests
        working-directory: engine
        run: |
          ./build_tests/frame_sync_test
          ./build_tests/ecs_test
          ./build_tests/ecs_physics_sync_test

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest absl-py

      - name: Run pytest
        run: |
          python -m pytest gfootball/frame_sync/ -v

  e2e-test:
    name: E2E Frame Sync Test
    runs-on: ubuntu-latest
    needs: [cpp-tests, python-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install absl-py

      - name: Run E2E test
        run: |
          python -m gfootball.frame_sync.run_e2e_test || true
        continue-on-error: true
