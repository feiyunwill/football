# GitHub Actions CI: C++ 编译/测试 + Python 测试
# 触发：push 到 master 或 PR

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  cpp-tests:
    name: C++ Tests (GCC 15, C++23)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev \
            libboost-system-dev libboost-thread-dev libboost-filesystem-dev \
            libgl-dev libegl-dev python3-dev cmake

      - name: Configure C++ tests
        working-directory: engine
        run: |
          cmake -S tests -B build_tests \
            -DCMAKE_CXX_COMPILER=g++-15 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_PCH=OFF

      - name: Build C++ tests
        working-directory: engine
        # 2026-09-09: repository builds use one compiler process.
        # run: cmake --build build_tests -j 2
        run: cmake --build build_tests -j 1

      - name: Run C++ tests
        working-directory: engine
        # 2026-09-09: run every discovered test; three selected binaries hid failures.
        # run: ./build_tests/frame_sync_test; ./build_tests/ecs_test; ./build_tests/ecs_physics_sync_test
        run: ctest --test-dir build_tests --output-on-failure

      - name: Build production UDP, TCP and lobby targets
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          # 2026-09-09: verify native-only compilation and relocated Python packaging.
          # cmake -S engine -B engine/build_ci -DCMAKE_CXX_COMPILER=g++-15 -DCMAKE_BUILD_TYPE=Release
          # cmake --build engine/build_ci -j 1 --target football_client football_server football_client_tcp football_server_tcp football_lobby headless_match
          python3 .project/checks/native_boundary.py --build engine/build_ci

      - name: Verify native match and snapshot determinism
        # 2026-09-09: acceptance builds keep native artifacts in their build directory.
        # run: python3 engine/tests/run_headless_regression.py bin/headless_match --frames 1000
        run: python3 engine/tests/run_headless_regression.py engine/build_ci/bin/headless_match --frames 1000

      - name: Verify native and Python environment ownership
        env:
          CC: gcc-15
          CXX: g++-15
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python3 .project/checks/environment_lifetime.py --build engine/build_ci

      - name: Verify snapshot transactions and render isolation
        env:
          CC: gcc-15
          CXX: g++-15
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python3 .project/checks/simulation_contract.py --build engine/build_ci

      - name: Verify full-engine sanitizers and lifecycle integration
        env:
          CC: gcc-15
          CXX: g++-15
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python3 .project/checks/architecture_regression.py --build engine/build_ci_sanitized

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest absl-py

      - name: Run pytest
        run: |
          python -m pytest gfootball/frame_sync/ -v

      - name: Verify milestone acceptance infrastructure
        run: python3 .project/quality.py run plan-19.1.1

  # 2026-09-09: historical E2E job had no native engine and suppressed all failures.
  # The production lobby socket E2E is now part of CTest; full engine multi-process
  # determinism remains a separate acceptance requirement (see milestone review).
