name: Native training acceptance

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-training:
    name: Native training (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CC: gcc-15
      CXX: g++-15
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 cmake libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev libboost-system-dev libboost-thread-dev libboost-filesystem-dev libgl-dev libegl-dev libssl-dev
      - name: Install Python validation dependencies
        run: python -m pip install 'pybind11>=3,<4' 'numpy>=1.24,<3' 'gymnasium>=1.3,<2' 'pygame-ce>=2.5.8,<3' 'opencv-python>=4.8,<6' 'absl-py>=2,<3' six psutil
      - name: Test acceptance failure and freshness gates
        run: python .project/native-training/test_quality.py -v
      - name: Test learning statistics and performance decision gates
        run: python .project/native-training/test_learning_study.py -v
      - name: Build and validate fresh native training artifacts
        run: python .project/native-training/quality.py run --build-root "$RUNNER_TEMP/native-training-build" --output "$RUNNER_TEMP/native-training-evidence"
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-training-evidence-py${{ matrix.python }}
          path: ${{ runner.temp }}/native-training-evidence
